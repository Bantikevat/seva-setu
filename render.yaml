services:
  - type: web
    name: seva-auth
    runtime: node
    rootDir: services/auth-service
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sevasetu-ujjain.vercel.app,https://seva-setu-phi.vercel.app

  - type: web
    name: seva-user
    runtime: node
    rootDir: services/user-service
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        fromService: { type: web, name: seva-auth, envVarKey: JWT_SECRET }
      - key: CORS_ORIGINS
        value: https://sevasetu-ujjain.vercel.app,https://seva-setu-phi.vercel.app

